<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Schnellkasse Bar</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--panel2:#f9fafb;--text:#111827;--muted:#6b7280;--line:#d1d5db;--head:#fff;--key:#e5e7eb;--blue:#2563eb;--green:#16a34a;--red:#b91c1c;--shadow:#0002}body.dark{--bg:#111827;--panel:#1f2937;--panel2:#111827;--text:#f9fafb;--muted:#9ca3af;--line:#374151;--head:#0b1220;--key:#374151;--shadow:#0006}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);touch-action:manipulation}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:var(--head);padding:10px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}header h1{font-size:19px;margin:0;flex:1}.headInfo{text-align:right}.headTill{font-weight:900}.cash{font-weight:900;color:var(--green);font-size:14px}main{padding:12px;max-width:1050px;margin:auto;padding-bottom:84px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.drink{min-height:120px;border:0;border-radius:18px;padding:12px;font-weight:900;font-size:20px;box-shadow:0 5px 14px var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:center}.drink small{font-size:14px;margin-top:8px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--head);padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;border-top:1px solid var(--line)}.nav button,.btn{border:0;border-radius:12px;padding:12px 9px;font-weight:800;background:var(--key);color:var(--text)}.nav button.active{background:var(--blue);color:#fff}.btn.primary{background:var(--green);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.danger{background:var(--red);color:#fff}.btn.big{min-height:68px;font-size:21px}.btn.back{width:100%;margin-top:9px}.section{display:none}.section.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}.card h2,.card h3{margin-top:0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0}label{display:block;color:var(--muted);font-size:14px}input,select{width:100%;margin-top:5px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px}.list{display:grid;gap:8px}.item{background:var(--panel2);border:1px solid var(--line);padding:11px;border-radius:12px;display:flex;gap:9px;align-items:center}.item .grow{flex:1}.muted{color:var(--muted);font-size:13px}.amount{font-size:38px;font-weight:950}.stat{font-size:25px;font-weight:900}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:center;justify-content:center;padding:10px}.modal.show{display:flex}.dialog{width:min(540px,100%);max-height:96vh;overflow:auto;background:var(--panel);border-radius:20px;padding:16px;border:1px solid var(--line)}.dialog h2{text-align:center;margin-top:2px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.keypad button{min-height:72px;border:0;border-radius:14px;font-size:27px;font-weight:950;background:var(--key);color:var(--text)}.display{font-size:42px;text-align:center;font-weight:950;padding:10px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.switch{display:flex;align-items:center;gap:8px}.switch input{width:auto;margin:0}.colorDot{width:28px;height:28px;border-radius:8px;flex:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:600px){main{padding:9px;padding-bottom:78px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.drink{min-height:105px;font-size:18px}.nav button{font-size:12px;padding:10px 4px}.dialog{padding:13px}.keypad button{min-height:66px}}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cartLine{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.chart{display:grid;gap:12px;margin-top:12px}.chartHour{font-weight:900;margin-top:8px}.chartRow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 42px;gap:8px;align-items:center}.chartTrack{height:24px;background:var(--key);border-radius:7px;overflow:hidden}.chartBar{height:100%;min-width:3px;border-radius:7px}@media(max-width:600px){.choice{grid-template-columns:1fr}.chartRow{grid-template-columns:88px 1fr 34px}}
</style></head><body>
<header><h1>🍺 Schnellkasse</h1><div class="headInfo"><div class="headTill" id="headTill">Keine Kasse</div><div class="cash" id="cashTop">0,00 €</div></div></header>
<main>
<section id="sale" class="section active"><div id="noTill" class="card hidden"><b>Bitte zuerst unter Einstellungen eine Kasse auswählen.</b></div><div id="drinkGrid" class="grid"></div></section>
<section id="history" class="section"><div class="card"><h2>Kassen-Historie</h2><div class="row"><label>Kasse<select id="historyTill" onchange="renderHistory()"></select></label></div><div id="historyList" class="list"></div></div></section>
<section id="stats" class="section"><div class="card"><h2>Statistik</h2><div class="row"><label>Kasse<select id="statsTill" onchange="renderStats()"></select></label></div></div><div id="statsBox"></div></section>
<section id="settings" class="section">
<div class="card"><h2>Darstellung</h2><div class="toolbar"><button class="btn" onclick="setTheme('light')">☀️ Daymode</button><button class="btn" onclick="setTheme('dark')">🌙 Darkmode</button></div></div>
<div class="card"><h2>Kasse / Bediener</h2><div class="row"><label>Aktive Kasse<select id="activeTill" onchange="changeTill()"></select></label><label>Bediener (optional)<input id="operator" placeholder="z. B. Jan" onchange="saveOperator()"></label></div><div class="row"><label>Neue Kasse<input id="newTill" placeholder="z. B. Bierwagen"></label></div><button class="btn primary" onclick="addTill()">+ Kasse anlegen</button><div id="tillList" class="list" style="margin-top:12px"></div></div>
<div class="card"><h2>Anfangsbestand</h2><div class="row"><label>Betrag €<input id="opening" type="number" step="0.01" inputmode="decimal"></label></div><button class="btn primary" onclick="bookOpening()">Anfangsbestand buchen</button></div>
<div class="card"><h2>Zwischenleerung</h2><div class="row"><label>Betrag €<input id="emptyAmount" type="number" step="0.01" inputmode="decimal"></label><label>Wer?<input id="emptyWho" placeholder="optional"></label></div><button class="btn" onclick="addEmptying()">Zwischenleerung buchen</button></div>
<div class="card"><h2>Pfand</h2><div class="row"><label>Bezeichnung<input id="depName" placeholder="z. B. Becherpfand"></label><label>Pfand pro Stück €<input id="depValue" type="number" step="0.01" inputmode="decimal"></label><label>Zuweisen<select id="depAssign"><option value="none">Noch nicht zuweisen</option><option value="all">Allen Getränken zuweisen</option></select></label></div><button class="btn primary" onclick="addDeposit()">+ Pfand anlegen</button><div id="depositList" class="list" style="margin-top:12px"></div></div>
<div class="card"><h2>Getränke</h2><div class="row"><label>Name<input id="dName"></label><label>Preis €<input id="dPrice" type="number" step="0.01" inputmode="decimal"></label><label>Pfand<select id="dDeposit"></select></label><label>Farbe<input id="dColor" type="color" value="#2563eb"></label></div><button class="btn primary" id="drinkSaveBtn" onclick="saveDrink()">+ Getränk anlegen</button><button class="btn hidden" id="drinkCancelBtn" onclick="cancelDrinkEdit()">Bearbeitung abbrechen</button><div id="drinkSettings" class="list" style="margin-top:12px"></div></div>
<div class="card"><h2>Tagesabschluss</h2><div class="row"><label>Gezählter Endbestand €<input id="countedCash" type="number" step="0.01" inputmode="decimal" oninput="renderClosing()"></label><div><div class="muted">Sollbestand</div><div class="stat" id="expectedCash">0,00 €</div></div><div><div class="muted">Differenz</div><div class="stat" id="cashDiff">0,00 €</div></div></div><button class="btn danger" onclick="bookClosing()">Tagesendbestand buchen</button></div>
<div class="card"><button class="btn danger" onclick="resetAll()">Alle Kassendaten zurücksetzen</button></div>
</section></main>
<nav class="nav"><button class="active" data-sec="sale">Kasse</button><button data-sec="history">Historie</button><button data-sec="stats">Statistik</button><button data-sec="settings">Einstellungen</button></nav><div id="modal" class="modal"><div class="dialog" id="dialog"></div></div>
<script>
const K='barKasseV2';
const defaultDrinks=[['Bier',3.5,'#2563eb'],['Radler',3.5,'#2563eb'],['Alkfreies Bier',3.5,'#2563eb'],['Wasser',2.5,'#6b7280'],['Rotwein',4,'#7f1d1d'],['Weißwein',4,'#f5e7a1'],['Cola',3,'#6b3f20'],['Fanta',3,'#facc15'],['Sprite',3,'#e5e7eb']].map((x,i)=>({id:'d'+i,name:x[0],price:x[1],color:x[2],depositId:null}));
let db=JSON.parse(localStorage.getItem(K)||'null')||{theme:'dark',tills:[{id:'t1',name:'Bierwagen'}],activeTillId:'t1',operator:'',deposits:[{id:'p1',name:'Pfand',value:0.5}],drinks:defaultDrinks.map(d=>({...d,depositId:['Rotwein','Weißwein'].includes(d.name)?null:'p1'})),sales:[],cashEvents:[]};
let flow={},editDrinkId=null;const $=id=>document.getElementById(id);const euro=n=>(Number(n)||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});const now=()=>new Date().toISOString();
function persist(){localStorage.setItem(K,JSON.stringify(db))}function save(){persist();renderAll()}function activeTill(){return db.tills.find(t=>t.id===db.activeTillId)}function depFor(d){return db.deposits.find(p=>p.id===d.depositId)}
function textColor(hex){let h=hex.replace('#',''),r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return(r*299+g*587+b*114)/1000>160?'#111827':'#fff'}
function setTheme(t){db.theme=t;document.body.classList.toggle('dark',t==='dark');save()}
function tillSales(id){return db.sales.filter(x=>x.tillId===id)}function tillEvents(id){return db.cashEvents.filter(x=>x.tillId===id)}function cashNow(id=db.activeTillId){let openings=tillEvents(id).filter(x=>x.type==='opening').reduce((s,x)=>s+x.amount,0),closings=tillEvents(id).filter(x=>x.type==='closing');let lastClose=closings.length?Math.max(...closings.map(x=>new Date(x.time).getTime())):0;let baseEvents=tillEvents(id).filter(x=>new Date(x.time).getTime()>lastClose);let opening=baseEvents.filter(x=>x.type==='opening').reduce((s,x)=>s+x.amount,0);let sales=tillSales(id).filter(x=>!x.voided&&new Date(x.time).getTime()>lastClose).reduce((s,x)=>s+x.total,0);let empties=baseEvents.filter(x=>x.type==='emptying').reduce((s,x)=>s+x.amount,0);return opening+sales-empties}
function renderDrinks(){let ok=!!activeTill();$('noTill').classList.toggle('hidden',ok);$('drinkGrid').innerHTML=ok?db.drinks.map(d=>{let p=depFor(d);return `<button class="drink" style="background:${d.color};color:${textColor(d.color)}" onclick="selectDrink('${d.id}')">${esc(d.name)}<small>${euro(d.price)}${p?' · Pfand '+euro(p.value):''}</small></button>`}).join(''):''}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectDrink(id){let d=db.drinks.find(x=>x.id===id);if(!flow.active)flow={active:true,cart:[],returns:0,depositId:null,input:''};flow.drink=d;showQty()}
function keys(action){return `<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="${action}(${n})">${n}</button>`).join('')}<button onclick="clearInput()">C</button><button onclick="${action}(0)">0</button><button onclick="backspace()">⌫</button></div>`}
function clearInput(){flow.input='';$('numDisplay').textContent='–'}function backspace(){flow.input=flow.input.slice(0,-1);$('numDisplay').textContent=flow.input||'–'}
function showQty(){flow.input='';$('dialog').innerHTML=`<h2>${esc(flow.drink.name)} – Anzahl</h2><div class="display" id="numDisplay">–</div>${keys('qtyKey')}<button class="btn back" onclick="cancelCurrentDrink()">← Zurück</button>`;$('modal').classList.add('show')}
function qtyKey(n){if(n===0)return;flow.qty=n;flow.cart.push({drink:flow.drink,qty:n});showNextChoice()}
function cancelCurrentDrink(){if(flow.cart.length)showNextChoice();else closeModal(true)}
function purchaseDeposit(x){let p=depFor(x.drink);return p?x.qty*p.value:0}
function cartHtml(){return flow.cart.map(x=>{let p=depFor(x.drink),drinkSum=x.qty*x.drink.price,depSum=p?x.qty*p.value:0;return `<div class="cartLine"><span>${x.qty} × ${esc(x.drink.name)}</span><b>${euro(drinkSum)}</b></div>${p?`<div class="cartLine muted"><span>＋ ${x.qty} × ${esc(p.name)}</span><b>＋ ${euro(depSum)}</b></div>`:''}`}).join('')}
function showNextChoice(){$('dialog').innerHTML=`<h2>Wie weiter?</h2><div class="card">${cartHtml()}</div><div class="choice"><button class="btn blue big" onclick="addAnotherDrink()">＋ Weiteres Getränk</button><button class="btn primary big" onclick="startDeposit()">↩ Pfand</button></div><button class="btn back" onclick="removeLastItem()">← Letztes Getränk zurück</button>`}
function addAnotherDrink(){$('modal').classList.remove('show');document.querySelector('[data-sec="sale"]').click()}
function removeLastItem(){flow.cart.pop();if(!flow.cart.length)return closeModal(true);showNextChoice()}
function startDeposit(){let ids=[...new Set(flow.cart.map(x=>x.drink.depositId).filter(Boolean))];if(!ids.length){flow.returns=0;flow.depositId=null;return showTotal()}if(ids.length===1){flow.depositId=ids[0];return showDeposit()}$('dialog').innerHTML=`<h2>Welches Pfand?</h2><div class="list">${ids.map(id=>{let p=db.deposits.find(x=>x.id===id);return `<button class="btn big" onclick="flow.depositId='${id}';showDeposit()">${esc(p.name)} · ${euro(p.value)}</button>`}).join('')}</div><button class="btn back" onclick="showNextChoice()">← Zurück</button>`}
function showDeposit(){let p=db.deposits.find(x=>x.id===flow.depositId);flow.input='';$('dialog').innerHTML=`<h2>Pfand zurück</h2><div class="muted" style="text-align:center">${esc(p.name)}: ${euro(p.value)} pro Stück</div><div class="display" id="numDisplay">–</div><button class="btn primary big" style="width:100%;margin-bottom:10px" onclick="flow.returns=0;showTotal()">Kein Pfand</button>${keys('depositKey')}<button class="btn back" onclick="showNextChoice()">← Zurück</button>`}
function depositKey(n){flow.input+=String(n);let r=parseInt(flow.input,10);if(!Number.isFinite(r))return;flow.returns=r;showTotal()}
function calcTotal(){let p=db.deposits.find(x=>x.id===flow.depositId),gross=flow.cart.reduce((s,x)=>s+x.qty*x.drink.price+purchaseDeposit(x),0);return Math.max(0,gross-flow.returns*(p?p.value:0))}
function showTotal(){flow.total=calcTotal();let p=db.deposits.find(x=>x.id===flow.depositId);$('dialog').innerHTML=`<h2>Zu zahlen</h2><div class="amount" style="text-align:center">${euro(flow.total)}</div><div class="card">${cartHtml()}${flow.returns?`<div class="cartLine"><span>${flow.returns} × ${esc(p.name)} zurück</span><b>− ${euro(flow.returns*p.value)}</b></div>`:''}</div><button class="btn primary big" style="width:100%" onclick="showPayment()">Bezahlen</button><button class="btn back" onclick="${p?'showDeposit()':'showNextChoice()'}">← Zurück</button>`}
function showPayment(){$('dialog').innerHTML=`<h2>Gegeben</h2><div class="muted" style="text-align:center">Zu zahlen: ${euro(flow.total)}</div><div class="quick"><button class="btn big primary" onclick="finishSale(${flow.total})">Passend</button>${[5,10,20,50].map(v=>`<button class="btn big" onclick="finishSale(${v})">${v} €</button>`).join('')}</div><label style="margin-top:12px">Anderer Betrag €<input id="customPay" type="number" step="0.01" inputmode="decimal"></label><button class="btn blue big" style="width:100%;margin-top:10px" onclick="finishSale(Number($('customPay').value))">Rückgeld berechnen</button><button class="btn back" onclick="showTotal()">← Zurück</button>`}
function finishSale(given){if(!Number.isFinite(given)||given<flow.total){alert('Gegebener Betrag ist kleiner als der Zahlbetrag.');return}flow.given=given;flow.change=given-flow.total;$('dialog').innerHTML=`<h2>Rückgeld</h2><div class="amount" style="text-align:center">${euro(flow.change)}</div><button class="btn primary big" style="width:100%;margin-top:16px" onclick="commitSale()">Fertig</button><button class="btn back" onclick="showPayment()">← Zurück</button>`}
function commitSale(){let p=db.deposits.find(x=>x.id===flow.depositId),deduction=flow.returns*(p?p.value:0),stamp=now(),base=Date.now();flow.cart.forEach((x,i)=>{let saleDeposit=depFor(x.drink);db.sales.push({id:base+i,time:stamp,tillId:db.activeTillId,operator:db.operator,drinkId:x.drink.id,drink:x.drink.name,qty:x.qty,returns:i===0?flow.returns:0,depositValue:saleDeposit?saleDeposit.value:0,total:x.qty*x.drink.price+purchaseDeposit(x)-(i===0?deduction:0),given:i===0?flow.given:0,change:i===0?flow.change:0,transactionId:base})});save();closeModal(true)}function closeModal(reset=false){$('modal').classList.remove('show');if(reset)flow={}}
function fillTillSelect(sel,all=false){let current=sel.value||db.activeTillId;sel.innerHTML=(all?'<option value="all">Alle Kassen</option>':'')+db.tills.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');sel.value=[...sel.options].some(o=>o.value===current)?current:(all?'all':db.activeTillId)}
function renderHistory(){fillTillSelect($('historyTill'),true);let id=$('historyTill').value;let ev=db.cashEvents.filter(x=>id==='all'||x.tillId===id).sort((a,b)=>new Date(b.time)-new Date(a.time));$('historyList').innerHTML=ev.map(x=>{let t=db.tills.find(t=>t.id===x.tillId),label=x.type==='opening'?'Anfangsbestand':x.type==='emptying'?'Zwischenleerung':'Tagesendbestand',sign=x.type==='emptying'?'− ':'';return `<div class="item"><div class="grow"><b>${label} · ${esc(t?t.name:'Gelöschte Kasse')}</b><div class="muted">${new Date(x.time).toLocaleString('de-DE')}${x.who?' · '+esc(x.who):''}${x.type==='closing'?' · Soll '+euro(x.expected)+' · Differenz '+euro(x.diff):''}</div></div><b>${sign}${euro(x.amount)}</b></div>`}).join('')||'<div class="muted">Noch keine Kassenereignisse.</div>'}
function selectedStatsSales(){let id=$('statsTill').value,ids=id==='all'?db.tills.map(t=>t.id):[id];return db.sales.filter(x=>ids.includes(x.tillId)&&!x.voided)}
function renderStats(){fillTillSelect($('statsTill'),true);let id=$('statsTill').value,ids=id==='all'?db.tills.map(t=>t.id):[id],sales=selectedStatsSales(),events=db.cashEvents.filter(x=>ids.includes(x.tillId));let revenue=sales.reduce((s,x)=>s+x.total,0),returns=sales.reduce((s,x)=>s+x.returns,0),empties=events.filter(x=>x.type==='emptying').reduce((s,x)=>s+x.amount,0),sold={};sales.forEach(x=>{sold[x.drink]??={qty:0,revenue:0,returns:0};sold[x.drink].qty+=x.qty;sold[x.drink].revenue+=x.total;sold[x.drink].returns+=x.returns});$('statsBox').innerHTML=`<div class="card"><button class="btn blue big" style="width:100%" onclick="showSalesChart()">📊 Grafik: Verkäufe nach Uhrzeit</button></div><div class="card"><div class="row"><div><div class="muted">Umsatz</div><div class="stat">${euro(revenue)}</div></div><div><div class="muted">Verkaufspositionen</div><div class="stat">${sales.length}</div></div><div><div class="muted">Pfandrückgaben</div><div class="stat">${returns}</div></div><div><div class="muted">Zwischenleerungen</div><div class="stat">${euro(empties)}</div></div></div></div><div class="card"><h3>Getränke</h3><div class="list">${Object.entries(sold).map(([n,v])=>`<div class="item"><div class="grow"><b>${esc(n)}</b><div class="muted">${v.qty} verkauft · ${v.returns} Pfand zurück</div></div><b>${euro(v.revenue)}</b></div>`).join('')||'<div class="muted">Noch keine Verkäufe.</div>'}</div></div><div class="card"><h3>Kassen</h3><div class="list">${ids.map(tid=>{let t=db.tills.find(x=>x.id===tid);return `<div class="item"><div class="grow"><b>${esc(t?t.name:'Kasse')}</b></div><b>${euro(cashNow(tid))}</b></div>`}).join('')}</div></div>`}
function showSalesChart(){let sales=selectedStatsSales(),data={},max=0;sales.forEach(x=>{let h=new Date(x.time).getHours();data[h]??={};data[h][x.drink]=(data[h][x.drink]||0)+x.qty;max=Math.max(max,data[h][x.drink])});let html=Object.keys(data).sort((a,b)=>a-b).map(h=>`<div><div class="chartHour">${String(h).padStart(2,'0')}:00–${String((+h+1)%24).padStart(2,'0')}:00 Uhr</div>${Object.entries(data[h]).sort((a,b)=>b[1]-a[1]).map(([name,qty])=>{let d=db.drinks.find(x=>x.name===name),color=d?d.color:'#2563eb';return `<div class="chartRow"><span>${esc(name)}</span><div class="chartTrack"><div class="chartBar" style="width:${qty/max*100}%;background:${color}"></div></div><b>${qty}</b></div>`}).join('')}</div>`).join('');$('dialog').innerHTML=`<h2>Verkäufe nach Uhrzeit</h2><div class="chart">${html||'<div class="muted">Noch keine Verkäufe vorhanden.</div>'}</div><button class="btn back" onclick="closeModal()">Schließen</button>`;$('modal').classList.add('show')}
function renderSettings(){fillTillSelect($('activeTill'));$('activeTill').value=db.activeTillId;$('operator').value=db.operator||'';$('tillList').innerHTML=db.tills.map(t=>`<div class="item"><div class="grow"><b>${esc(t.name)}</b>${t.id===db.activeTillId?'<div class="muted">Aktiv</div>':''}</div><button class="btn" onclick="renameTill('${t.id}')">✏️</button></div>`).join('');$('dDeposit').innerHTML='<option value="">Kein Pfand</option>'+db.deposits.map(p=>`<option value="${p.id}">${esc(p.name)} · ${euro(p.value)}</option>`).join('');$('depositList').innerHTML=db.deposits.map(p=>`<div class="item"><div class="grow"><b>${esc(p.name)}</b><div class="muted">${euro(p.value)} pro Stück · ${db.drinks.filter(d=>d.depositId===p.id).length} Getränke</div></div><button class="btn" onclick="editDeposit('${p.id}')">✏️</button><button class="btn danger" onclick="deleteDeposit('${p.id}')">🗑️</button></div>`).join('')||'<div class="muted">Noch kein Pfand angelegt.</div>';$('drinkSettings').innerHTML=db.drinks.map(d=>{let p=depFor(d);return `<div class="item"><span class="colorDot" style="background:${d.color}"></span><div class="grow"><b>${esc(d.name)}</b><div class="muted">${euro(d.price)} · ${p?'Pfand '+euro(p.value):'kein Pfand'}</div></div><button class="btn" onclick="editDrink('${d.id}')">✏️</button><button class="btn danger" onclick="deleteDrink('${d.id}')">🗑️</button></div>`}).join('');renderClosing()}
function changeTill(){db.activeTillId=$('activeTill').value;save()}function saveOperator(){db.operator=$('operator').value.trim();save()}function addTill(){let n=$('newTill').value.trim();if(!n)return alert('Bitte Kassenname eingeben.');let id='t'+Date.now();db.tills.push({id,name:n});db.activeTillId=id;$('newTill').value='';save()}function renameTill(id){let t=db.tills.find(x=>x.id===id),n=prompt('Name der Kasse:',t.name);if(n&&n.trim()){t.name=n.trim();save()}}
function bookOpening(){if(!activeTill())return alert('Bitte Kasse auswählen.');let a=Number($('opening').value);if(a<0||!Number.isFinite(a))return alert('Gültigen Betrag eingeben.');db.cashEvents.push({id:Date.now(),type:'opening',tillId:db.activeTillId,time:now(),amount:a,who:db.operator||''});$('opening').value='';save()}
function addEmptying(){if(!activeTill())return alert('Bitte Kasse auswählen.');let a=Number($('emptyAmount').value),w=$('emptyWho').value.trim()||db.operator||'';if(!(a>0))return alert('Bitte Betrag eingeben.');db.cashEvents.push({id:Date.now(),type:'emptying',tillId:db.activeTillId,time:now(),amount:a,who:w});$('emptyAmount').value='';$('emptyWho').value='';save()}
function addDeposit(){let n=$('depName').value.trim()||'Pfand',v=Number($('depValue').value),assign=$('depAssign').value;if(v<0||!Number.isFinite(v))return alert('Gültigen Pfandbetrag eingeben.');let id='p'+Date.now();db.deposits.push({id,name:n,value:v});if(assign==='all')db.drinks.forEach(d=>d.depositId=id);$('depName').value='';$('depValue').value='';save()}
function editDeposit(id){let p=db.deposits.find(x=>x.id===id),n=prompt('Bezeichnung:',p.name);if(n===null)return;let v=prompt('Pfand pro Stück in €:',String(p.value).replace('.',','));if(v===null)return;v=Number(v.replace(',','.'));if(!Number.isFinite(v)||v<0)return alert('Ungültiger Betrag.');p.name=n.trim()||'Pfand';p.value=v;save()}function deleteDeposit(id){if(!confirm('Pfand löschen? Zugewiesene Getränke haben danach kein Pfand.'))return;db.drinks.forEach(d=>{if(d.depositId===id)d.depositId=null});db.deposits=db.deposits.filter(p=>p.id!==id);save()}
function saveDrink(){let n=$('dName').value.trim(),p=Number($('dPrice').value),dep=$('dDeposit').value||null,c=$('dColor').value;if(!n||p<0||!Number.isFinite(p))return alert('Name und gültigen Preis eingeben.');if(editDrinkId){let d=db.drinks.find(x=>x.id===editDrinkId);Object.assign(d,{name:n,price:p,depositId:dep,color:c})}else db.drinks.push({id:'d'+Date.now(),name:n,price:p,depositId:dep,color:c});cancelDrinkEdit(false);save()}
function editDrink(id){let d=db.drinks.find(x=>x.id===id);editDrinkId=id;$('dName').value=d.name;$('dPrice').value=d.price;$('dDeposit').value=d.depositId||'';$('dColor').value=d.color;$('drinkSaveBtn').textContent='Änderungen speichern';$('drinkCancelBtn').classList.remove('hidden');$('dName').scrollIntoView({behavior:'smooth',block:'center'})}function cancelDrinkEdit(clear=true){editDrinkId=null;$('drinkSaveBtn').textContent='+ Getränk anlegen';$('drinkCancelBtn').classList.add('hidden');if(clear){$('dName').value='';$('dPrice').value='';$('dDeposit').value='';$('dColor').value='#2563eb'}}function deleteDrink(id){if(confirm('Getränk löschen?')){db.drinks=db.drinks.filter(d=>d.id!==id);save()}}
function renderClosing(){let e=cashNow();$('expectedCash').textContent=euro(e);let c=Number($('countedCash').value);$('cashDiff').textContent=euro(Number.isFinite(c)?c-e:0)}function bookClosing(){if(!activeTill())return alert('Bitte Kasse auswählen.');let c=Number($('countedCash').value);if(c<0||!Number.isFinite(c))return alert('Gezählten Endbestand eingeben.');let e=cashNow();if(!confirm(`Tagesendbestand ${euro(c)} für ${activeTill().name} buchen?`))return;db.cashEvents.push({id:Date.now(),type:'closing',tillId:db.activeTillId,time:now(),amount:c,expected:e,diff:c-e,who:db.operator||''});$('countedCash').value='';save()}
function renderAll(){document.body.classList.toggle('dark',db.theme==='dark');renderDrinks();renderHistory();renderStats();renderSettings();let t=activeTill();$('headTill').textContent=t?t.name:'Keine Kasse';$('cashTop').textContent=euro(t?cashNow():0)}function resetAll(){if(confirm('Wirklich ALLE Kassendaten zurücksetzen?')){localStorage.removeItem(K);location.reload()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$(b.dataset.sec).classList.add('active');renderAll()});renderAll();
</script></body></html>
